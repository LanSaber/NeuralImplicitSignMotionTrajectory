_base_: csl_daily_signtrajfield_v3_sentence_memory_phase_a_motion_contrast_v1.yaml

# Stage 1 of the ordered Phase-A'' experiment. Candidate metadata can affect
# attention keys, while only VAE motion mu enters the value/residual path.
# This stage deliberately has no slot/token temporal prior.
experiment_name: csl_daily_signtrajfield_v3_sentence_memory_phase_a_split_kv_motion_contrast_v1

sentence_memory:
  key_value_mode: factorized_metadata_motion_v1
  temporal_prior_mode: none
  temporal_prior_sigma: 0.25
  temporal_prior_scale: 1.0

validation_text_partition:
  # Pins the only validation-row artifact the training process may open.
  expected_partition_artifact_identity: 2d915a1b5c709a799eb2973d20b5b2ce6d9b0ae2d11b2871bfb221fe1a516a0a
  expected_development_manifest_sha256: 9a0fc32fad9bfc8168af31086a0bd8ac08cc7821e987578d51d3bd10bf70651f

eval:
  sentence_memory_word_prior_mode: "off"
  sentence_memory_modes:
    - "off"
    - "on"
    - "motion_shuffled"
    - "shuffled"
    - "analytic_prior"
  export_sentence_memory_mode: "on"
  evaluation_corruption:
    mode: fixed_query_condition_v1
    seed: 1234
    nonce: csl_daily_validation_corruption_v1

selection:
  aggregation: normalized_text_cluster_equal_v1

output:
  out_dir: experiments/NIAF/continuous_trajectory_field/csl_daily_signtrajfield_v3_sentence_memory_phase_a_split_kv_motion_contrast_v1
