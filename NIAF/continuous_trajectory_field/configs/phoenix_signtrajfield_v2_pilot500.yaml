_base_: phoenix_signtrajfield_v2_overfit5.yaml

experiment_name: phoenix_signtrajfield_v2_pilot500

data:
  val_split: val
  limit_train: 500
  limit_val: 100

train:
  epochs: 30
  batch_size: 32
  accumulation_steps: 2
  max_samples_per_memory_batch: 16
  max_frames_per_memory_batch: 4096
  # Keep loading synchronous: workers are first started after CUDA, T5, and the
  # scaffold provider are initialized, so fork-based workers can inherit locks.
  num_workers: 0
  persistent_workers: false
  prefetch_factor: 2
  val_every: 2
  save_every: 1

eval:
  num_workers: 0
  max_samples_per_memory_batch: 1
  max_frames_per_memory_batch: 512
  empty_cache_between_batches: true

output:
  out_dir: experiments/NIAF/continuous_trajectory_field/phoenix_signtrajfield_v2_pilot500

