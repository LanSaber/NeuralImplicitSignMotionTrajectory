experiment_name: phoenix_continuous_trajectory_overfit5_smooth_q32_jreg1e2_w10
seed: 1234
device: auto

data:
  data_dir: /media/cvpr/haomian/data/SOKE_FLOW/phoenix_upper_smplx
  word_data_dir: /media/cvpr/haomian/data/SOKE_FLOW/phoenix_upper_smplx_word_ctc
  train_split: train
  val_split: train
  min_frames: 40
  max_frames: 400
  length_multiple: 4
  random_crop: false
  limit_train: 5
  limit_val: 5

cache:
  fk_cache_dir: /media/cvpr/haomian/data/SOKE_FLOW/phoenix_upper_smplx/meta/niaf_fk_rot6d_h2s_fixed
  fk_batch_size: 64

text:
  model_path: deps/flan-t5-base
  device: cpu
  max_tokens: 64
  local_files_only: true
  cache: true
  condition_field: text

adapter:
  checkpoint: experiments/flow/adapter/phoenix_soft_arranger_adapter_ctc_all_text_noneg_k64_b128x4_v2_online/checkpoints/epoch_0400.pt
  vae_checkpoint: experiments/flow/VAE/phoenix_rot6d_vae_jerk_b16x4_online_retry1/checkpoints/best.pt
  word_data_dir: /media/cvpr/haomian/data/SOKE_FLOW/phoenix_upper_smplx_word_ctc
  word_split: train.balanced
  condition_field: text
  text_model_path: deps/flan-t5-base
  max_text_tokens: 64
  lazy_word_motions: true
  shuffle_word_candidates: false
  num_negative_candidates: 0
  candidate_seed: 1234

scaffold:
  source: adapter_pred
  cache_dir: /media/cvpr/haomian/data/SOKE_FLOW/phoenix_upper_smplx/meta/niaf_adapter_scaffold_confidence_trainbalanced_epoch0400
  cache_only: true
  prefer_cache: true
  require_retrieval_features: true

retrieval:
  require_train_only_bank: true

model:
  type: continuous_trajectory_field
  context_hidden_dim: 128
  context_layers: 2
  field_hidden_dim: 256
  field_depth: 4
  max_local_fields: 0
  frames_per_local_field: 20
  minimum_local_width: 0.06
  maximum_local_width: 0.50
  quantile_temperature: 0.02
  omega0_first: 10.0
  omega0_hidden: 1.0
  residual_amplitude: 0.10
  residual_amplitude_learnable: true
  dropout: 0.0

duration:
  initial_seconds: 4.0
  min_seconds: 0.8
  max_seconds: 20.0
  min_frames: 40
  max_frames: 400
  length_multiple: 4
  huber_beta: 0.15

loss:
  hand_weight: 8.0
  lambda_rot6d: 1.0
  lambda_geo: 0.05
  lambda_joint: 5.0
  lambda_hand: 10.0
  lambda_hand_relative: 5.0
  lambda_expr: 1.0
  lambda_vel: 0.0
  lambda_vel_hand: 0.0
  lambda_acc: 0.0
  lambda_path: 1.0

objective:
  lambda_endpoint: 1.0
  lambda_prior: 0.25
  lambda_residual: 0.50
  lambda_duration: 0.25
  lambda_local_modulation: 0.0
  lambda_local_width: 0.0

temporal_loss:
  lambda_fk_vel: 0.50
  lambda_fk_acc: 0.10
  lambda_fk_jerk: 0.02
  fk_temporal_include_hand_parts: true

analytic_dynamics:
  start_epoch: 20
  jerk_start_epoch: 40
  jerk_ramp_epochs: 20
  query_count: 32
  smooth_kernel: 7
  smooth_sigma: 1.5
  duration_teacher_forcing: true
  randomize_queries: true
  jerk_target_ratio: 0.75
  lambda_analytic_fk_vel: 0.05
  lambda_analytic_fk_acc: 0.005
  lambda_analytic_fk_jerk: 0.0005
  lambda_analytic_fk_jerk_reg: 0.010

validation_dynamics:
  enabled: true
  query_count: 32
  smooth_kernel: 7
  smooth_sigma: 1.5
  duration_teacher_forcing: true
  jerk_target_ratio: 0.75

selection:
  weights:
    pred_loss_endpoint: 1.0
    pred_loss_hand_relative: 10.0
    pred_loss_path: 0.5
    pred_loss_fk_jerk: 0.1
  constraint_penalty: 100.0
  constraints:
    pred_loss_endpoint:
      max: 1.8
      scale: 1.8
    pred_loss_path:
      max: 0.25
      scale: 0.25
    pred_dense_analytic_fk_jerk_ratio:
      max: 1.0
      scale: 1.0

train:
  epochs: 500
  batch_size: 5
  accumulation_steps: 1
  num_workers: 0
  pin_memory: true
  drop_last: false
  lr: 0.0002
  weight_decay: 0.0001
  grad_clip: 1.0
  max_train_batches: 0
  val_every: 10
  save_every: 10

eval:
  max_batches: 0

metrics:
  model_dir: deps/smpl_models
  gender: NEUTRAL
  betas_mode: h2s_fixed
  fk_batch_size: 64

output:
  out_dir: experiments/NIAF/continuous_trajectory_field/phoenix_continuous_trajectory_overfit5_smooth_q32_jreg1e2_w10
