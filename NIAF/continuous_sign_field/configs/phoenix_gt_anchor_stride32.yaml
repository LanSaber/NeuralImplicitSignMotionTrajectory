experiment_name: phoenix_continuous_smplx_residual_flow_gt_anchor_stride32
seed: 1234
device: auto

data:
  data_dir: /media/cvpr/haomian/data/SOKE_FLOW/phoenix_upper_smplx
  word_data_dir: /media/cvpr/haomian/data/SOKE_FLOW/phoenix_upper_smplx_word_ctc
  train_split: train
  val_split: val
  min_frames: 4
  max_frames: 1000
  length_multiple: 4
  random_crop: false
  limit_train: 0
  limit_val: 0

cache:
  fk_cache_dir: /media/cvpr/haomian/data/SOKE_FLOW/phoenix_upper_smplx/meta/niaf_fk_rot6d_h2s_fixed
  fk_batch_size: 128

text:
  model_path: deps/flan-t5-base
  device: cpu
  max_tokens: 64
  local_files_only: true
  cache: true
  condition_field: text

adapter:
  checkpoint: experiments/flow/adapter/phoenix_soft_arranger_adapter_balanced_b64x4_gloss_online/checkpoints/best.pt
  note: reserved_for_stage2_predicted_scaffold

scaffold:
  source: gt_anchors
  interpolation: slerp
  anchor_stride: 32

model:
  type: residual_flow_transformer
  hidden_dim: 512
  num_layers: 6
  num_heads: 8
  dropout: 0.1
  time_fourier_bands: 8
  use_text_cross_attention: true

flow:
  source_noise_sigma: 0.05
  source_noise_kernel: 9
  source_noise_smooth_sigma: 2.0

loss:
  hand_weight: 5.0
  lambda_fm: 1.0
  lambda_rot6d: 1.0
  lambda_geo: 0.05
  lambda_joint: 10.0
  lambda_hand: 20.0
  lambda_expr: 1.0
  lambda_vel: 5.0
  lambda_vel_hand: 10.0
  lambda_acc: 1.0
  lambda_path: 0.5
  lambda_res: 0.0001

train:
  epochs: 20
  batch_size: 2
  num_workers: 0
  pin_memory: true
  drop_last: false
  lr: 0.0002
  weight_decay: 0.0001
  grad_clip: 1.0
  max_train_batches: 0
  val_every: 1
  save_every: 1

eval:
  max_batches: 0
  solver_steps: 4

metrics:
  model_dir: deps/smpl_models
  gender: NEUTRAL
  betas_mode: h2s_fixed
  fk_batch_size: 128

output:
  out_dir: experiments/NIAF/continuous_sign_field/phoenix_gt_anchor_stride32
