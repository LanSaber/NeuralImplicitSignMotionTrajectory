experiment_name: how2sign_oracle_smplx_rot6d_field_stage2_dense_physics
seed: 1234
device: cuda

data:
  data_dir: /media/cvpr/haomian/data/SOKE_FLOW/how2sign_soke_upper_smplx
  split: val
  max_sequences: 3
  min_frames: 40
  max_frames: 160
  length_multiple: 4

model:
  hidden: 256
  depth: 3
  omega0_first: 20.0
  omega0_hidden: 1.0
  residual_scale_init: 0.1
  residual_scale_learnable: true

fit:
  field_range: "-1_1"
  steps: 1000
  batch_points: 128
  dense_points: 96
  lr: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0

loss:
  hand_weight: 3.0

grid:
  models: [linear_rot6d, slerp, residual_siren_linear, residual_siren_slerp]
  time_modes: [uniform]
  fit_modes: [stride_4, block_middle_25, keyframe_sparse_8]
  loss_schedules: [S4]
  max_runs: 0

metrics:
  model_dir: deps/smpl_models
  gender: NEUTRAL
  smplx_batch_size: 128
  betas_mode: h2s_fixed

output:
  out_dir: experiments/NIAF/oracle_smplx_field/how2sign_stage2_dense_physics
  save_npz: true
  flush_every_run: true
